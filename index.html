<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIG Odontologia | Agendamento Inteligente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0a192f; color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        
        .card { width: 100%; max-width: 700px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.18); }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 20px; color: #fff; }
        h1 span { color: #d4af37; }

        .section-title { font-size: 1rem; color: #d4af37; margin: 20px 0 10px 0; font-weight: 600; }
        
        /* Serviços */
        .grid-services { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .service-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 10px; cursor: pointer; color: #fff; text-align: left; }
        .service-btn.active { border-color: #25d366; background: rgba(37,211,102,0.2); }

        /* Horário e Inputs */
        .time-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="time"], input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; outline: none; font-size: 1rem; }
        
        /* Botão Urgência */
        .urgency-btn { background: #e63946; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .urgency-btn.active { outline: 3px solid #fff; }

        /* Resumo e Confirmação */
        .summary { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-top: 20px; font-size: 0.9rem; line-height: 1.6; }
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 10px; background: #25d366; color: #fff; text-decoration: none; padding: 15px; border-radius: 50px; font-weight: 700; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>VIG Odontologia <br><span>Agendamento Online</span></h1>

    <!-- 1. SERVIÇO -->
    <div class="section-title"><i class="fa-solid fa-tooth"></i> 1. Selecione o Serviço:</div>
    <div class="grid-services">
        <button class="service-btn active" onclick="setService(this, 'Avaliação & Limpeza')">Avaliação & Limpeza</button>
        <button class="service-btn" onclick="setService(this, 'Implante Dentário')">Implante Dentário</button>
        <button class="service-btn" onclick="setService(this, 'Clareamento Dental')">Clareamento</button>
    </div>

    <!-- 2. HORÁRIO PERSONALIZADO -->
    <div class="section-title"><i class="fa-regular fa-clock"></i> 2. Digite ou Escolha o Horário:</div>
    <div class="time-inputs">
        <input type="time" id="customTime" value="09:00" onchange="validateTime()">
    </div>
    
    <button class="urgency-btn" onclick="setUrgent()">
        <i class="fa-solid fa-bolt"></i> Urgência / Plantão 24h (Atendimento Imediato)
    </button>

    <!-- 3. NOME -->
    <div class="section-title"><i class="fa-solid fa-user"></i> 3. Seu Nome:</div>
    <input type="text" id="clientName" placeholder="Digite seu nome..." oninput="updateSummary()">

    <!-- RESUMO -->
    <div class="summary" id="summaryBox">
        Selecione os dados para ver o resumo.
    </div>

    <a href="#" id="waBtn" target="_blank" class="btn-whatsapp" onclick="confirmBooking()">
        <i class="fa-brands fa-whatsapp"></i> Confirmar Agendamento no WhatsApp
    </a>
</div>

<script>
    let service = "Avaliação & Limpeza";
    let isUrgent = false;
    const phone = "554499862487";

    // Simula banco de dados local com horários ocupados
    let bookedTimes = JSON.parse(localStorage.getItem('vigo_booked')) || ["10:00", "14:30"];

    function setService(el, name) {
        document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        service = name;
        updateSummary();
    }

    function setUrgent() {
        isUrgent = !isUrgent;
        const btn = document.querySelector('.urgency-btn');
        if(isUrgent) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
        updateSummary();
    }

    function validateTime() {
        isUrgent = false;
        document.querySelector('.urgency-btn').classList.remove('active');
        const selected = document.getElementById('customTime').value;

        if (bookedTimes.includes(selected)) {
            alert(`O horário ${selected} já está reservado por outro paciente! Por favor, escolha outro horário mais para a frente.`);
            document.getElementById('customTime').value = "";
        }
        updateSummary();
    }

    function updateSummary() {
        const timeVal = isUrgent ? "EMERGÊNCIA 24H (Imediato)" : (document.getElementById('customTime').value || "Não selecionado");
        const nameVal = document.getElementById('clientName').value || "Não informado";

        document.getElementById('summaryBox').innerHTML = `
            <strong>Resumo:</strong><br>
            • <strong>Serviço:</strong> ${service}<br>
            • <strong>Horário:</strong> ${timeVal}<br>
            • <strong>Paciente:</strong> ${nameVal}
        `;

        const msg = `Olá! Gostaria de agendar:%0A- *Serviço:* ${service}%0A- *Horário:* ${timeVal}%0A- *Nome:* ${nameVal}`;
        document.getElementById('waBtn').href = `https://wa.me/${phone}?text=${msg}`;
    }

    function confirmBooking() {
        const timeVal = document.getElementById('customTime').value;
        if (!isUrgent && timeVal) {
            // Salva o horário no histórico para bloquear futuros agendamentos
            bookedTimes.push(timeVal);
            localStorage.setItem('vigo_booked', JSON.stringify(bookedTimes));
        }
    }

    updateSummary();
</script>

</body>
</html>
