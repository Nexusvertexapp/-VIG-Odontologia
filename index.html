<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIG Odontologia | Agendamento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-950:#07080a;
    --bg-900:#0d0f13;
    --ink:#f2f4f7;
    --ink-dim:rgba(242,244,247,0.6);
    --blue:#3b82f6;
    --blue-dim:#2f66c9;
    --blue-soft:#8fb6f7;
    --whatsapp:#25d366;
    --danger:#e6394a;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 18px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(59,130,246,0.14), transparent 55%),
      radial-gradient(800px 460px at 105% 15%, rgba(59,130,246,0.08), transparent 55%),
      linear-gradient(180deg, var(--bg-950), #000 75%);
  }

  ::selection{background:var(--blue); color:#fff;}

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--blue-soft);
    outline-offset:3px;
  }

  .card{
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.10);
    border-radius:var(--radius-lg);
    padding:30px 26px 28px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.85);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-70px; right:-70px;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(59,130,246,0.28), transparent 70%);
    pointer-events:none;
  }

  /* ---------- Brand header ---------- */
  header{text-align:center; margin-bottom:22px;}
  .mark{
    width:56px; height:56px;
    margin:0 auto 14px;
    border-radius:16px;
    background:linear-gradient(145deg, var(--blue), var(--blue-dim));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px -6px rgba(59,130,246,0.55);
  }
  .mark i{color:#fff; font-size:1.35rem;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  header p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:0.95rem;
    color:var(--blue-soft);
    margin-top:2px;
  }

  /* ---------- Step indicator ---------- */
  .steps{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin:20px 0 26px;
    padding:0 6px;
  }
  .step{display:flex; align-items:center; gap:8px; flex:1;}
  .step .dot{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:700;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    color:rgba(242,244,247,0.5);
    flex-shrink:0;
    transition:all .3s ease;
  }
  .step.done .dot{background:var(--blue); border-color:var(--blue); color:#fff;}
  .step .label{font-size:0.68rem; color:rgba(242,244,247,0.5); white-space:nowrap;}
  .step.done .label{color:var(--ink);}
  .step .line{height:1px; flex:1; background:rgba(255,255,255,0.14); margin-right:-2px;}
  .step:last-child .line{display:none;}

  /* ---------- Sections ---------- */
  .section-title{
    font-size:0.72rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.09em;
    color:var(--blue-soft);
    margin:22px 0 10px;
    display:flex; align-items:center; gap:7px;
  }
  .section-title i{font-size:0.8rem; color:var(--blue);}

  /* ---------- Services ---------- */
  .grid-services{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
  .service-btn{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-md);
    padding:14px 8px;
    cursor:pointer;
    color:var(--ink);
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:0.83rem;
    font-weight:500;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:all .2s ease;
  }
  .service-btn i{font-size:1.15rem; color:var(--blue-soft); transition:color .2s ease;}
  .service-btn:hover{border-color:rgba(255,255,255,0.3);}
  .service-btn.active{
    border-color:var(--blue);
    background:rgba(59,130,246,0.15);
  }
  .service-btn.active i{color:var(--blue-soft);}

  /* ---------- Time slots ---------- */
  .slot-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
  .slot-btn{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:var(--radius-sm);
    padding:9px 4px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    cursor:pointer;
    transition:all .2s ease;
  }
  .slot-btn:hover{border-color:rgba(255,255,255,0.3);}
  .slot-btn.active{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .slot-btn.booked{opacity:0.32; cursor:not-allowed; text-decoration:line-through;}
  .slot-btn.booked:hover{border-color:rgba(255,255,255,0.14);}

  .other-time{margin-top:10px;}

  /* ---------- Inputs ---------- */
  label.field-label{display:block; font-size:0.78rem; color:rgba(242,244,247,0.65); margin-bottom:6px;}
  .input-box{
    width:100%; padding:12px 14px;
    border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.03);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    outline:none;
    transition:border-color .2s ease;
  }
  .input-box:focus{border-color:var(--blue);}
  .input-box::placeholder{color:rgba(242,244,247,0.32);}

  /* ---------- Urgency ---------- */
  .urgency-btn{
    width:100%; margin-top:22px;
    background:rgba(230,57,74,0.14);
    border:1px solid rgba(230,57,74,0.4);
    color:#ff9aa4;
    padding:13px; border-radius:var(--radius-sm);
    font-weight:600; font-size:0.85rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:all .2s ease;
  }
  .urgency-btn i{color:#ff8080;}
  .urgency-btn:hover{background:rgba(230,57,74,0.2);}
  .urgency-btn.active{background:var(--danger); border-color:var(--danger); color:#fff;}
  .urgency-btn.active i{color:#fff;}

  /* ---------- Summary ---------- */
  .summary{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    border-left:3px solid var(--blue);
    padding:16px 18px;
    border-radius:var(--radius-md);
    margin-top:24px;
    font-size:0.87rem;
    line-height:1.85;
  }
  .summary strong{color:var(--blue-soft); font-weight:600;}
  .summary .row{display:flex; justify-content:space-between; gap:10px;}
  .summary .row span:last-child{color:var(--ink); font-weight:500; text-align:right;}

  /* ---------- CTA ---------- */
  .btn-whatsapp{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--whatsapp);
    color:#06280f;
    text-decoration:none;
    padding:16px; border-radius:50px;
    font-weight:700; font-size:0.98rem;
    margin-top:20px;
    box-shadow:0 10px 25px -8px rgba(37,211,102,0.5);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-whatsapp:hover{transform:translateY(-2px); box-shadow:0 14px 30px -8px rgba(37,211,102,0.6);}
  .btn-whatsapp.disabled{opacity:0.4; pointer-events:none; box-shadow:none;}

  .footnote{text-align:center; font-size:0.68rem; color:rgba(242,244,247,0.38); margin-top:14px;}

  @media (max-width:380px){
    .slot-grid{grid-template-columns:repeat(3, 1fr);}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="card">
  <header>
    <div class="mark"><i class="fa-solid fa-tooth"></i></div>
    <h1>VIG</h1>
    <p>Odontologia &middot; Agendamento rápido</p>
  </header>

  <div class="steps" id="stepsBar">
    <div class="step done" data-step="1">
      <div class="dot">1</div><span class="label">Serviço</span><div class="line"></div>
    </div>
    <div class="step" data-step="2">
      <div class="dot">2</div><span class="label">Horário</span><div class="line"></div>
    </div>
    <div class="step" data-step="3">
      <div class="dot">3</div><span class="label">Dados</span><div class="line"></div>
    </div>
  </div>

  <div class="section-title"><i class="fa-solid fa-stethoscope"></i> Selecione o serviço</div>
  <div class="grid-services" id="serviceGrid">
    <button class="service-btn active" data-service="Avaliação Geral" aria-pressed="true">
      <i class="fa-solid fa-stethoscope"></i><span>Avaliação Geral</span>
    </button>
    <button class="service-btn" data-service="Limpeza Dentária" aria-pressed="false">
      <i class="fa-solid fa-teeth"></i><span>Limpeza Dentária</span>
    </button>
    <button class="service-btn" data-service="Implante Dentário" aria-pressed="false">
      <i class="fa-solid fa-tooth"></i><span>Implantes</span>
    </button>
    <button class="service-btn" data-service="Clareamento Dental" aria-pressed="false">
      <i class="fa-solid fa-wand-magic-sparkles"></i><span>Clareamento</span>
    </button>
  </div>

  <div class="section-title"><i class="fa-regular fa-clock"></i> Escolha um horário</div>
  <div class="slot-grid" id="slotGrid"></div>

  <div class="other-time">
    <label class="field-label" for="customTime">Prefere outro horário? Digite abaixo:</label>
    <input type="text" id="customTime" class="input-box" placeholder="Ex: 19:30 ou Manhã de sábado">
  </div>

  <button class="urgency-btn" id="urgentBtn" aria-pressed="false">
    <i class="fa-solid fa-bolt"></i> Agendamento urgente / plantão 24h
  </button>

  <div class="section-title"><i class="fa-solid fa-user"></i> Seus dados</div>
  <label class="field-label" for="clientName">Nome completo</label>
  <input type="text" id="clientName" class="input-box" placeholder="Digite seu nome...">

  <div class="summary" id="summaryBox"></div>

  <a href="#" id="waBtn" target="_blank" rel="noopener" class="btn-whatsapp disabled">
    <i class="fa-brands fa-whatsapp"></i> Confirmar pelo WhatsApp
  </a>
  <p class="footnote">Você será redirecionado ao WhatsApp da clínica para confirmar.</p>
</div>

<script>
(function(){
  const phone = "554499862487";
  const slotTimes = ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30",
                      "14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30"];

  let service = "Avaliação Geral";
  let selectedTime = "";
  let isUrgent = false;
  let bookedTimes = [];
  try{ bookedTimes = JSON.parse(localStorage.getItem('vigo_booked')) || []; }catch(e){ bookedTimes = []; }

  const slotGrid = document.getElementById('slotGrid');
  const customTime = document.getElementById('customTime');
  const clientName = document.getElementById('clientName');
  const urgentBtn = document.getElementById('urgentBtn');
  const summaryBox = document.getElementById('summaryBox');
  const waBtn = document.getElementById('waBtn');
  const stepsBar = document.getElementById('stepsBar');

  function buildSlots(){
    slotGrid.innerHTML = "";
    slotTimes.forEach(t => {
      const btn = document.createElement('button');
      btn.type = "button";
      btn.className = "slot-btn";
      btn.textContent = t;
      const isBooked = bookedTimes.includes(t.toLowerCase());
      if (isBooked){
        btn.classList.add('booked');
        btn.disabled = true;
        btn.setAttribute('aria-disabled','true');
        btn.title = "Horário indisponível";
      } else {
        btn.addEventListener('click', () => selectSlot(t, btn));
      }
      slotGrid.appendChild(btn);
    });
  }

  function selectSlot(time, btn){
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTime = time;
    customTime.value = "";
    if (isUrgent){ isUrgent = false; urgentBtn.classList.remove('active'); urgentBtn.setAttribute('aria-pressed','false'); }
    update();
  }

  document.querySelectorAll('.service-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.service-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed','true');
      service = btn.dataset.service;
      update();
    });
  });

  customTime.addEventListener('input', () => {
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
    selectedTime = "";
    if (isUrgent){ isUrgent = false; urgentBtn.classList.remove('active'); urgentBtn.setAttribute('aria-pressed','false'); }
    const typed = customTime.value.trim().toLowerCase();
    if (typed !== "" && bookedTimes.includes(typed)){
      customTime.style.borderColor = "#e6394a";
    } else {
      customTime.style.borderColor = "";
    }
    update();
  });

  urgentBtn.addEventListener('click', () => {
    isUrgent = !isUrgent;
    urgentBtn.classList.toggle('active', isUrgent);
    urgentBtn.setAttribute('aria-pressed', String(isUrgent));
    if (isUrgent){
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
      selectedTime = "";
      customTime.value = "";
    }
    update();
  });

  clientName.addEventListener('input', update);

  function currentTimeLabel(){
    if (isUrgent) return "Urgência / Plantão 24h";
    if (selectedTime) return selectedTime;
    if (customTime.value.trim()) return customTime.value.trim();
    return "A definir";
  }

  function updateSteps(){
    const hasTime = isUrgent || selectedTime || customTime.value.trim();
    const hasName = clientName.value.trim().length > 0;
    const stepEls = stepsBar.querySelectorAll('.step');
    stepEls[0].classList.add('done');
    stepEls[1].classList.toggle('done', !!hasTime);
    stepEls[2].classList.toggle('done', !!hasTime && hasName);
  }

  function update(){
    const timeLabel = currentTimeLabel();
    const name = clientName.value.trim();
    const ready = (isUrgent || selectedTime || customTime.value.trim()) && name.length > 0;

    summaryBox.innerHTML =
      '<div class="row"><span><strong>Serviço</strong></span><span>' + service + '</span></div>' +
      '<div class="row"><span><strong>Horário</strong></span><span>' + timeLabel + '</span></div>' +
      '<div class="row"><span><strong>Nome</strong></span><span>' + (name || "—") + '</span></div>';

    waBtn.classList.toggle('disabled', !ready);

    const messageText =
      'Olá! Gostaria de fazer um agendamento na VIG Odontologia:%0A%0A' +
      '📌 *Serviço:* ' + encodeURIComponent(service) + '%0A' +
      '⏰ *Horário:* ' + encodeURIComponent(timeLabel) + '%0A' +
      '👤 *Nome:* ' + encodeURIComponent(name || "Não informado") + '%0A%0A' +
      'Aguardo a confirmação da equipe!';
    waBtn.href = 'https://wa.me/' + phone + '?text=' + messageText;

    updateSteps();
  }

  waBtn.addEventListener('click', (e) => {
    if (waBtn.classList.contains('disabled')){ e.preventDefault(); return; }
    const timeVal = (selectedTime || customTime.value.trim()).toLowerCase();
    if (!isUrgent && timeVal !== ""){
      bookedTimes.push(timeVal);
      try{ localStorage.setItem('vigo_booked', JSON.stringify(bookedTimes)); }catch(e){}
    }
  });

  buildSlots();
  update();
})();
</script>

</body>
</html>
